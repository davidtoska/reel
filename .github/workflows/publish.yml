# Publishes the packages to npm with trusted publishing (OIDC) – no npm token is stored anywhere.
# Runs when a GitHub release is published, or by hand. Only packages whose version in package.json
# is not on npm yet are published, so a release can contain one, two or all three packages.
#
# Each package must trust this workflow once, on npmjs.com:
#   package → Settings → Trusted Publisher → GitHub Actions
#   owner: davidtoska · repository: reel · workflow: publish.yml

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets npm verify that the package comes from this workflow

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # In dependency order: reel-player depends on reel-format.
      - name: Publish new versions
        run: |
          for p in reel-schema reel-format reel-player; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$p@$v" version >/dev/null 2>&1; then
              echo "$p@$v is already on npm – skipping"
            else
              echo "Publishing $p@$v"
              npm publish -w "$p"
            fi
          done
